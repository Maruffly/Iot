# app3: a tiny web server that answers with its name and the pod that served it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  labels:
    app: app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: traefik/whoami:v1.12.0
          env:
            - name: WHOAMI_NAME   # printed as "Name: app3" in every response
              value: app3
          ports:
            - containerPort: 80
---
# Stable internal address (ClusterIP) in front of the app3 pods
apiVersion: v1
kind: Service
metadata:
  name: app3
spec:
  selector:
    app: app3
  ports:
    - port: 80
      targetPort: 80
