# app1: a tiny web server that answers with its name and the pod that served it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: traefik/whoami:v1.12.0
          env:
            - name: WHOAMI_NAME   # printed as "Name: app1" in every response
              value: app1
          ports:
            - containerPort: 80
---
# Stable internal address (ClusterIP) in front of the app1 pods
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
